[project]
name = "moonlight"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kannan" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.5",
    "ollama>=0.6.2",
    "pillow>=12.2.0",
    "playwright>=1.59.0",
    "python-multipart>=0.0.29",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.47.0",
]

[project.scripts]
moonlight = "moonlight:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
