name: Build binaries (amd64)

# Manual trigger only — go to Actions tab → "Build binaries (amd64)" → "Run workflow"
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.1.0). Empty = date-based tag."
        required: false
        default: ""

permissions:
  contents: write   # needed to create a release and upload assets

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Stamp build metadata
        env:
          MOONLIGHT_REVOCATION_URL: ${{ secrets.MOONLIGHT_REVOCATION_URL }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          BUILD_ID="ml-$BUILD_DATE-$(head -c4 /dev/urandom | xxd -p)"
          VERSION=$(grep -E '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          cat > src/moonlight/_buildinfo.py <<EOF
          """Build-time stamped constants. Do not edit by hand."""
          BUILD_DATE = "$BUILD_DATE"
          BUILD_ID = "$BUILD_ID"
          VERSION = "$VERSION"
          REVOCATION_URL = "$MOONLIGHT_REVOCATION_URL"
          EOF
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Install deps
        run: |
          uv sync
          uv add --dev nuitka
          uv run playwright install --with-deps chromium

      - name: Nuitka compile
        run: |
          uv run python -m nuitka \
            --standalone \
            --output-dir=dist \
            --output-filename=moonlight \
            --remove-output \
            --assume-yes-for-downloads \
            --include-package=moonlight \
            --include-package=fastapi \
            --include-package=uvicorn \
            --include-package=jinja2 \
            --include-package=playwright \
            --include-package=ollama \
            --include-package=PIL \
            --include-package=numpy \
            --include-package=yaml \
            --include-package=click \
            --include-package=rich \
            --include-package=httpx \
            --include-package-data=moonlight \
            --include-package-data=playwright \
            --quiet \
            app.py

      - name: Package
        run: |
          OUT="moonlight-linux-amd64-$BUILD_DATE"
          mv dist/app.dist "dist/$OUT-runtime"
          mkdir -p "dist/$OUT"
          mv "dist/$OUT-runtime" "dist/$OUT/runtime"
          mkdir -p dist/$OUT/{scenarios,baselines,auth-state,logs,runs}
          cp config.yaml LICENSE OPERATIONS.md "dist/$OUT/" || true
          cp -r src/moonlight/templates dist/$OUT/runtime/moonlight/ 2>/dev/null || true
          cp -r src/moonlight/web/templates dist/$OUT/runtime/moonlight/web/ 2>/dev/null || true
          cp -r src/moonlight/web/static dist/$OUT/runtime/moonlight/web/ 2>/dev/null || true
          cp -r ~/.cache/ms-playwright "dist/$OUT/playwright-browsers" || true
          cat > "dist/$OUT/start.sh" <<'LAUNCH'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export MOONLIGHT_HOME="$HERE"
          export PLAYWRIGHT_BROWSERS_PATH="$HERE/playwright-browsers"
          exec "$HERE/runtime/moonlight" "$@"
          LAUNCH
          chmod +x "dist/$OUT/start.sh"
          cd dist && zip -rq "$OUT.zip" "$OUT"
          echo "ARTIFACT=dist/$OUT.zip" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$OUT.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-linux-amd64
          path: ${{ env.ARTIFACT }}
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Stamp build metadata
        env:
          MOONLIGHT_REVOCATION_URL: ${{ secrets.MOONLIGHT_REVOCATION_URL }}
        shell: pwsh
        run: |
          $BuildDate = (Get-Date).ToString("yyyy-MM-dd")
          $RandomHex = -join (1..4 | ForEach-Object { '{0:x2}' -f (Get-Random -Maximum 256) })
          $BuildId = "ml-$BuildDate-$RandomHex"
          $Version = (Select-String -Path pyproject.toml -Pattern '^version').Line -replace '.*"(.*)".*','$1'
          @"
          """Build-time stamped constants. Do not edit by hand."""
          BUILD_DATE = "$BuildDate"
          BUILD_ID = "$BuildId"
          VERSION = "$Version"
          REVOCATION_URL = "$env:MOONLIGHT_REVOCATION_URL"
          "@ | Set-Content -Encoding UTF8 src\moonlight\_buildinfo.py
          echo "BUILD_ID=$BuildId" | Out-File -Append $env:GITHUB_ENV
          echo "BUILD_DATE=$BuildDate" | Out-File -Append $env:GITHUB_ENV

      - name: Install deps
        shell: pwsh
        run: |
          uv sync
          uv add --dev nuitka
          uv run playwright install --with-deps chromium

      - name: Nuitka compile
        shell: pwsh
        run: |
          uv run python -m nuitka `
            --standalone `
            --output-dir=dist `
            --output-filename=moonlight.exe `
            --remove-output `
            --assume-yes-for-downloads `
            --include-package=moonlight `
            --include-package=fastapi `
            --include-package=uvicorn `
            --include-package=jinja2 `
            --include-package=playwright `
            --include-package=ollama `
            --include-package=PIL `
            --include-package=numpy `
            --include-package=yaml `
            --include-package=click `
            --include-package=rich `
            --include-package=httpx `
            --include-package-data=moonlight `
            --include-package-data=playwright `
            --windows-console-mode=force `
            --quiet `
            app.py

      - name: Package
        shell: pwsh
        run: |
          $Out = "moonlight-windows-amd64-$env:BUILD_DATE"
          Rename-Item "dist\app.dist" "$Out-runtime"
          New-Item -ItemType Directory -Path "dist\$Out" -Force | Out-Null
          Move-Item "dist\$Out-runtime" "dist\$Out\runtime"
          foreach ($d in @("scenarios","baselines","auth-state","logs","runs")) {
              New-Item -ItemType Directory -Path "dist\$Out\$d" -Force | Out-Null
          }
          Copy-Item config.yaml,LICENSE,OPERATIONS.md "dist\$Out\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse src\moonlight\templates "dist\$Out\runtime\moonlight\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse src\moonlight\web\templates "dist\$Out\runtime\moonlight\web\" -ErrorAction SilentlyContinue
          Copy-Item -Recurse src\moonlight\web\static "dist\$Out\runtime\moonlight\web\" -ErrorAction SilentlyContinue
          $PwCache = "$env:USERPROFILE\AppData\Local\ms-playwright"
          if (Test-Path $PwCache) { Copy-Item -Recurse $PwCache "dist\$Out\playwright-browsers" }
          @"
          @echo off
          set MOONLIGHT_HOME=%~dp0
          set PLAYWRIGHT_BROWSERS_PATH=%~dp0playwright-browsers
          "%~dp0runtime\moonlight.exe" %*
          "@ | Set-Content -Encoding ASCII "dist\$Out\start.bat"
          Compress-Archive -Path "dist\$Out\*" -DestinationPath "dist\$Out.zip"
          echo "ARTIFACT=dist\$Out.zip" | Out-File -Append $env:GITHUB_ENV
          echo "ARTIFACT_NAME=$Out.zip" | Out-File -Append $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-windows-amd64
          path: ${{ env.ARTIFACT }}
          retention-days: 14

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "TAG=${{ inputs.release_tag }}" >> $GITHUB_ENV
          else
            echo "TAG=build-$(date -u +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          fi

      - name: Create release with binaries attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: artifacts/**/*.zip
          draft: false
          prerelease: false
